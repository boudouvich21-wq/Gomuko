<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoMoKu - Connect-5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            background: radial-gradient(circle at center, #1f2633 0%, #0d1117 100%); 
            color: #f8fafc;
            overflow-x: hidden;
        }
        #start-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            padding: 50px 40px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 320px;
        }
        #start-screen h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        #start-screen input { 
            padding: 14px; 
            font-size: 16px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }
        #start-screen input:focus {
            border-color: #c4b5fd;
            box-shadow: 0 0 0 4px rgba(196, 181, 253, 0.15);
        }
        #start-screen button { 
            padding: 14px 28px; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%;
            cursor: pointer; 
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }
        #start-screen button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        #game-container { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            animation: fadeIn 0.6s ease forwards;
        }
        table.header { 
            width: 450px; 
            border-collapse: separate; 
            border-spacing: 0;
            border: 1px solid rgba(255, 255, 255, 0.06); 
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        table.header th {
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 10px 4px 10px;
        }
        table.header td { 
            padding: 4px 10px 14px 10px; 
            text-align: center; 
            font-size: 1.05rem;
            color: #f1f5f9;
        }
        .status-row { 
            font-weight: 600; 
            font-size: 0.85rem !important;
            letter-spacing: 0.5px;
            height: 38px; 
            padding: 0 !important;
            background-color: rgba(255, 255, 255, 0.04); 
            color: #38bdf8;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: middle;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(10, 45px);
            grid-template-rows: repeat(10, 45px);
            width: 450px; 
            height: 450px;
            border-radius: 12px; 
            background-image: url('background.gif'); 
            background-size: cover;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 8px #181d26;
            overflow: hidden;
        }
        .cell {
            border: 1px solid rgba(0, 0, 0, 0.15); 
            width: 45px; 
            height: 45px;
            box-sizing: border-box; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .cell:hover {
            background-color: rgba(255, 255, 255, 0.12); 
        }
        #board.locked .cell {
            cursor: not-allowed;
        }
        #board.locked .cell:hover {
            background-color: transparent;
        }
        .cell.occupied {
            cursor: default;
        }
        #identity {
            min-height: 24px;
            margin: -14px 0 20px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        #identity strong {
            color: #ffffff;
        }
        .status-error {
            color: #fca5a5 !important;
        }
        .status-success {
            color: #86efac !important;
        }
        .stone { 
            width: 39px; 
            height: 39px; 
            border-radius: 50%; 
            filter: drop-shadow(3px 5px 5px rgba(0, 0, 0, 0.45));
            animation: dropStone 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .black { background-image: url('blackStone.gif'); background-size: cover; }
        .white { background-image: url('whiteStone.gif'); background-size: cover; }
        @keyframes dropStone {
            0% { transform: scale(1.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 540px) {
            body {
                justify-content: flex-start;
                padding: 24px 12px;
                box-sizing: border-box;
            }
            #start-screen {
                width: min(320px, calc(100vw - 48px));
                padding: 38px 24px;
            }
            table.header {
                width: min(450px, calc(100vw - 32px));
            }
            #board {
                grid-template-columns: repeat(10, 1fr);
                grid-template-rows: repeat(10, 1fr);
                width: min(450px, calc(100vw - 32px));
                height: min(450px, calc(100vw - 32px));
            }
            .cell {
                width: auto;
                height: auto;
            }
            .stone {
                width: 86%;
                height: 86%;
            }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>GoMoKu</h2>
        <input type="text" id="player-name" placeholder="Enter Your Name" value="" />
        <button onclick="startGame()">Enter Arena</button>
    </div>

    <div id="game-container">
        <table class="header">
            <tr>
                <th id="p1_label">Player 1 (Black)</th>
                <th id="p2_label">Player 2 (White)</th>
            </tr>
            <tr>
                <td id="p1_name">Waiting...</td>
                <td id="p2_name">Waiting...</td>
            </tr>
            <tr>
                <td colspan="2" id="status" class="status-row">Connecting to server...</td>
            </tr>
        </table>
        <div id="identity"></div>
        <div id="board" class="locked"></div>
    </div>

    <script>
        const boardDiv = document.getElementById('board');
        const statusDiv = document.getElementById('status');
        const p1NameDiv = document.getElementById('p1_name');
        const p2NameDiv = document.getElementById('p2_name');
        const identityDiv = document.getElementById('identity');
        let myColor = null;
        let ws = null;
        let currentTurn = null;
        let gameStatus = 'idle';
        let boardState = Array.from({ length: 10 }, () => Array(10).fill(0));

        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 10; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.onclick = () => makeMove(r, c);
                boardDiv.appendChild(cell);
            }
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) {
                alert("Please enter your name.");
                return;
            }
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
            
            console.log("Connecting WebSocket to:", wsUrl);
            statusDiv.innerText = "Connecting to game server...";
            setStatusStyle();
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log("Connected!");
                statusDiv.innerText = "Connected. Joining matchmaking...";
                ws.send(JSON.stringify({ type: 'join', name: nameInput }));
            };

            ws.onmessage = function(event) {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (error) {
                    showConnectionError("The server sent an invalid response.");
                    return;
                }
                console.log("Received:", data.type);
                
                if (['waiting', 'start', 'state', 'error', 'game_over'].includes(data.type)) {
                    applyServerState(data);
                }
            };

            ws.onerror = function(error) {
                console.error("WebSocket error:", error);
                showConnectionError("Could not connect to the game server.");
            };
            
            ws.onclose = function() {
                console.log("WebSocket closed");
                boardDiv.classList.add('locked');
                if (!['finished', 'abandoned'].includes(gameStatus)) {
                    showConnectionError("Connection closed. Refresh the page to reconnect.");
                }
            };
        }

        function makeMove(r, c) {
            if (
                !myColor ||
                !ws ||
                ws.readyState !== WebSocket.OPEN ||
                gameStatus !== 'active' ||
                currentTurn !== myColor ||
                boardState[r][c] !== 0
            ) {
                return;
            }
            boardDiv.classList.add('locked');
            ws.send(JSON.stringify({ type: 'move', row: r, col: c }));
        }

        function applyServerState(data) {
            if (data.names) {
                p1NameDiv.innerText = data.names.black || "Waiting...";
                p2NameDiv.innerText = data.names.white || "Waiting...";
            }

            if (data.your_color) {
                myColor = data.your_color;
            }

            if (Array.isArray(data.board)) {
                boardState = data.board;
                renderBoard(boardState);
            }

            currentTurn = data.turn;
            gameStatus = data.status || gameStatus;
            statusDiv.innerText = data.message || "Game state updated.";
            setStatusStyle(data.type);
            updateIdentity();
            updateBoardLock();
        }

        function updateIdentity() {
            if (!myColor) {
                identityDiv.innerHTML = "";
                return;
            }
            const stoneName = myColor.charAt(0).toUpperCase() + myColor.slice(1);
            const turnText =
                gameStatus === 'active'
                    ? currentTurn === myColor
                        ? "Your move"
                        : "Opponent's move"
                    : gameStatus === 'waiting'
                        ? "Waiting for an opponent"
                        : "Game complete";
            identityDiv.innerHTML = `You are <strong>${stoneName}</strong> · ${turnText}`;
        }

        function updateBoardLock() {
            const canMove =
                gameStatus === 'active' &&
                currentTurn === myColor &&
                ws &&
                ws.readyState === WebSocket.OPEN;
            boardDiv.classList.toggle('locked', !canMove);
        }

        function setStatusStyle(messageType = '') {
            statusDiv.classList.toggle('status-error', messageType === 'error');
            statusDiv.classList.toggle('status-success', messageType === 'game_over');
        }

        function showConnectionError(message) {
            gameStatus = 'connection_error';
            statusDiv.innerText = message;
            setStatusStyle('error');
            updateIdentity();
            boardDiv.classList.add('locked');
        }

        function renderBoard(boardData) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = Number(cell.dataset.row);
                const c = Number(cell.dataset.col);
                cell.innerHTML = ''; 
                cell.classList.toggle('occupied', boardData[r][c] !== 0);
                if (boardData[r][c] === 1) {
                    cell.innerHTML = '<div class="stone black"></div>';
                } else if (boardData[r][c] === 2) {
                    cell.innerHTML = '<div class="stone white"></div>';
                }
            });
        }
    </script>
</body>
</html>
